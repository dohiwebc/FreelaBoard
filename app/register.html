<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新規登録 | FreelaBoard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", "Noto Sans JP", Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    a {
      color: #4f46e5;
      font-weight: 700;
      text-decoration: none;
    }

    .auth-page {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 32px 20px;
    }

    .auth-card {
      width: min(520px, 100%);
      padding: 42px;
      border: 1px solid #dbe1ea;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 16px 40px rgba(17, 24, 39, 0.08);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 22px;
      color: #0f1f45;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .brand-icon {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border: 3px solid #0f1f45;
      border-radius: 6px;
      font-size: 20px;
      line-height: 1;
    }

    .lead {
      margin: 0 0 34px;
      color: #4b5563;
      font-size: 17px;
      text-align: center;
    }

    .form {
      display: grid;
      gap: 22px;
    }

    .form-field {
      display: grid;
      gap: 9px;
    }

    label {
      color: #111827;
      font-size: 14px;
      font-weight: 700;
    }

    .help-text {
      margin: 0;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.6;
    }

    input {
      width: 100%;
      min-height: 46px;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      color: #111827;
      font: inherit;
      font-size: 15px;
    }

    input:focus {
      border-color: #4f46e5;
      outline: none;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.14);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 54px;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 10px;
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #4b5563;
      font-size: 18px;
      cursor: pointer;
      transform: translateY(-50%);
    }

    .toggle-password:hover {
      background: #f3f4f6;
    }

    .error-message {
      display: none;
      padding: 12px 14px;
      border-radius: 8px;
      background: #fee2e2;
      color: #b91c1c;
      font-size: 14px;
      line-height: 1.6;
    }

    .error-message.show {
      display: block;
    }

    .submit-button {
      min-height: 48px;
      border: none;
      border-radius: 8px;
      background: #6257e8;
      color: #ffffff;
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(98, 87, 232, 0.24);
    }

    .submit-button:hover {
      background: #5548dd;
    }

    .submit-button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    .divider {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 18px;
      align-items: center;
      margin: 28px 0;
      color: #6b7280;
      font-size: 14px;
    }

    .divider::before,
    .divider::after {
      height: 1px;
      background: #e5e7eb;
      content: "";
    }

    .footer-text {
      margin: 0;
      color: #6b7280;
      font-size: 14px;
      text-align: center;
    }

    @media (max-width: 560px) {
      .auth-card {
        padding: 28px 22px;
      }

      .brand {
        font-size: 26px;
      }
    }

  </style>
  <link rel="stylesheet" href="./assets/shared-layout.css?v=20260620-2">
  <link rel="stylesheet" href="./assets/common.css?v=20260620-2">
  <script src="./assets/demo-mode.js?v=20260620-2"></script>
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <div class="brand">
        <span class="brand-icon">▣</span>
        <span>FreelaBoard</span>
      </div>
      <p class="lead">新しいアカウントを作成</p>

      <form class="form" id="registerForm">
        <div class="form-field">
          <label for="userId">ユーザーID</label>
          <input id="userId" name="userId" type="text" placeholder="例：freela_taro" minlength="3" maxlength="20" pattern="[A-Za-z0-9_]{3,20}" required>
          <p class="help-text">半角英数字とアンダースコアのみ、3文字以上20文字以内</p>
        </div>

        <div class="form-field">
          <label for="email">メールアドレス</label>
          <input id="email" name="email" type="email" placeholder="例：example@email.com" autocomplete="email" required>
        </div>

        <div class="form-field">
          <label for="password">パスワード</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" placeholder="パスワードを入力" autocomplete="new-password" minlength="6" required>
            <button class="toggle-password" type="button" data-target="password" aria-label="パスワードを表示">◉</button>
          </div>
          <p class="help-text">半角英数字を含む6文字以上推奨</p>
        </div>

        <div class="form-field">
          <label for="confirmPassword">パスワード（確認用）</label>
          <div class="password-wrap">
            <input id="confirmPassword" name="confirmPassword" type="password" placeholder="パスワードを再入力" autocomplete="new-password" minlength="6" required>
            <button class="toggle-password" type="button" data-target="confirmPassword" aria-label="確認用パスワードを表示">◉</button>
          </div>
        </div>

        <p class="error-message" id="errorMessage"></p>

        <button class="submit-button" id="submitButton" type="submit">新規登録</button>
      </form>

      <div class="divider">または</div>

      <p class="footer-text">
        すでにアカウントをお持ちですか？
        <a href="./login.html">ログインはこちら</a>
      </p>
    </section>
  </main>

  <script type="module">
    import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { doc, serverTimestamp, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { auth, db } from "./firebase.js";

    const registerForm = document.getElementById("registerForm");
    const userIdInput = document.getElementById("userId");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const errorMessage = document.getElementById("errorMessage");
    const submitButton = document.getElementById("submitButton");

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.add("show");
    }

    function hideError() {
      errorMessage.textContent = "";
      errorMessage.classList.remove("show");
    }

    function getJapaneseErrorMessage(errorCode) {
      if (errorCode === "auth/email-already-in-use") {
        return "このメールアドレスはすでに登録されています。";
      }

      if (errorCode === "auth/invalid-email") {
        return "メールアドレスの形式が正しくありません。";
      }

      if (errorCode === "auth/weak-password") {
        return "パスワードは6文字以上で入力してください。";
      }

      if (errorCode === "auth/network-request-failed") {
        return "ネットワークエラーが発生しました。通信環境を確認してください。";
      }

      return "登録に失敗しました。入力内容を確認してください。";
    }

    function isValidUserId(userId) {
      return /^[A-Za-z0-9_]{3,20}$/.test(userId);
    }

    document.querySelectorAll(".toggle-password").forEach((button) => {
      button.addEventListener("click", () => {
        const input = document.getElementById(button.dataset.target);
        const isPassword = input.type === "password";

        input.type = isPassword ? "text" : "password";
        button.textContent = isPassword ? "○" : "◉";
        button.setAttribute("aria-label", isPassword ? "パスワードを非表示" : "パスワードを表示");
      });
    });

    // フォーム送信時にAuthenticationへ登録し、Firestoreへプロフィールを保存します。
    registerForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      hideError();

      const userId = userIdInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (!isValidUserId(userId)) {
        showError("ユーザーIDは半角英数字とアンダースコアのみ、3文字以上20文字以内で入力してください。");
        return;
      }

      if (password !== confirmPassword) {
        showError("パスワードと確認用パスワードが一致しません。");
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "登録中...";

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);

        await setDoc(doc(db, "users", userCredential.user.uid), {
          userId,
          email,
          createdAt: serverTimestamp()
        });

        window.location.href = "./dashboard.html";
      } catch (error) {
        showError(getJapaneseErrorMessage(error.code));
        submitButton.disabled = false;
        submitButton.textContent = "新規登録";
      }
    });
  </script>
  <script src="./assets/common.js?v=20260620-2"></script>
</body>
</html>
