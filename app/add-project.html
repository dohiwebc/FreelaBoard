<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>案件追加 | FreelaBoard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Inter", "Noto Sans JP", Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      width: 220px;
      height: 100vh;
      padding: 24px 16px;
      background: #0f2a4a;
      color: #ffffff;
    }

    .logo {
      margin: 0 0 28px;
      font-size: 20px;
      font-weight: 700;
    }

    .nav {
      display: grid;
      gap: 8px;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 8px;
      color: #dbeafe;
      font-size: 14px;
      font-weight: 700;
    }

    .nav-link:hover,
    .nav-link.active {
      background: #163b68;
      color: #ffffff;
    }

    .nav-icon {
      display: grid;
      place-items: center;
      width: 20px;
      height: 20px;
      font-size: 15px;
    }

    .nav-icon-image {
      width: 16px;
      height: 16px;
      object-fit: contain;
    }

    .logout {
      color: #dbeafe;
      font-size: 14px;
      font-weight: 700;
    }

    .sidebar-account {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: auto;
      margin-bottom: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
    }

    .sidebar-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .main {
      width: 100%;
      margin-left: 220px;
      padding: 40px;
    }

    .content {
      max-width: 860px;
      margin: 0 auto;
    }

    .back-link {
      display: inline-flex;
      margin-bottom: 18px;
      color: #2563eb;
      font-size: 14px;
      font-weight: 700;
    }

    .form-card {
      padding: 32px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 12px 30px rgba(17, 24, 39, 0.08);
    }

    .page-title {
      margin: 0 0 28px;
      font-size: 28px;
      letter-spacing: 0;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .form-field {
      display: grid;
      gap: 8px;
    }

    .form-field.full {
      grid-column: 1 / -1;
    }

    label {
      color: #374151;
      font-size: 14px;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      color: #111827;
      font: inherit;
      font-size: 14px;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #2563eb;
      outline: none;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
    }

    .items-section {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid #e5e7eb;
    }

    .tags-section {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid #e5e7eb;
    }

    .tag-options {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tag-option {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border: 1px solid #dbeafe;
      border-radius: 999px;
      background: #f8fafc;
      color: #1f2937;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .tag-option input {
      width: auto;
      accent-color: #2563eb;
    }

    .tag-empty {
      margin: 0;
      color: #6b7280;
      font-size: 13px;
    }

    .items-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .section-title {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0;
    }

    .items-help {
      margin: 0 0 14px;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.6;
    }

    .items-list {
      display: grid;
      gap: 12px;
    }

    .item-row {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr) 150px 180px 90px;
      gap: 12px;
      align-items: end;
      padding: 14px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #f9fafb;
      cursor: grab;
    }

    .drag-handle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 20px;
      margin-bottom: 10px;
      color: #9ca3af;
      font-size: 14px;
      cursor: inherit;
      user-select: none;
    }

    .ghost-button,
    .danger-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border: none;
      border-radius: 8px;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .ghost-button {
      background: #eef2ff;
      color: #1d4ed8;
    }

    .danger-button {
      background: #fee2e2;
      color: #dc2626;
    }

    .item-row.dragging {
      opacity: 0.55;
      border-color: #93c5fd;
      background: #eff6ff;
    }

    .item-row input,
    .item-row select,
    .item-row button,
    .item-row label,
    .item-row textarea {
      cursor: auto;
    }

    .total-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
      padding: 18px 20px;
      border-radius: 8px;
      background: #eff6ff;
      color: #123a74;
    }

    .total-label {
      font-size: 14px;
      font-weight: 700;
    }

    .total-value {
      font-size: 24px;
      font-weight: 700;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 28px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border: none;
      border-radius: 8px;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary-button {
      background: #123a74;
      color: #ffffff;
    }

    .primary-button:hover {
      background: #0f3264;
    }

    .secondary-button {
      background: #f3f4f6;
      color: #374151;
    }

    .button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .loading {
      padding: 14px 0 4px;
      color: #6b7280;
      font-size: 14px;
      text-align: center;
    }

    @media (max-width: 820px) {
      .layout {
        display: block;
      }

      .sidebar {
        position: static;
        width: 100%;
        height: auto;
        padding: 18px 16px;
      }

      .logo {
        margin-bottom: 16px;
      }

      .nav {
        grid-template-columns: repeat(10, minmax(0, 1fr));
      }

      .nav-link {
        justify-content: center;
        padding: 10px;
      }

      .nav-icon,
      .logout {
        display: none;
      }

      .main {
        margin-left: 0;
        padding: 24px 16px;
      }

      .form-card {
        padding: 24px;
      }

      .form-grid,
      .item-row {
        grid-template-columns: 1fr;
      }

      .actions {
        align-items: stretch;
        flex-direction: column-reverse;
      }

      .items-header {
        align-items: stretch;
        flex-direction: column;
      }
    }

  </style>
  <link rel="stylesheet" href="./assets/shared-layout.css?v=20260620-2">
  <link rel="stylesheet" href="./assets/common.css?v=20260620-2">
  <script src="./assets/demo-mode.js?v=20260620-2"></script>
</head>
<body>
  <header class="mobile-header">
    <button class="hamburger-button" type="button" aria-label="メニューを開く" aria-controls="appSidebar" aria-expanded="false"><span></span><span></span><span></span></button>
    <span class="mobile-logo">FreelaBoard</span>
  </header>
  <div class="sidebar-overlay" data-sidebar-overlay></div>
  <div class="layout">
    <aside class="sidebar" id="appSidebar">
      
      <button class="sidebar-close" type="button" aria-label="メニューを閉じる">×</button>
      <h1 class="logo">FreelaBoard</h1>

      <nav class="nav" aria-label="メインメニュー">
        <a class="nav-link" href="./dashboard.html">
          <span class="nav-icon">⌂</span>
          <span>ダッシュボード</span>
        </a>
        <a class="nav-link" href="./projects.html">
          <span class="nav-icon">☷</span>
          <span>案件一覧</span>
        </a>
        <a class="nav-link active" href="./add-project.html" aria-current="page">
          <span class="nav-icon">＋</span>
          <span>案件追加</span>
        </a>
        <a class="nav-link" href="./invoices.html">
          <span class="nav-icon">▤</span>
          <span>請求書一覧</span>
        </a>
        <a class="nav-link" href="./reports.html">
          <span class="nav-icon">↗</span>
          <span>レポート</span>
        </a>
        <a class="nav-link" href="./clients.html">
          <span class="nav-icon">◇</span>
          <span>クライアント管理</span>
        </a>
        <a class="nav-link" href="./tags.html">
          <span class="nav-icon">#</span>
          <span>タグ管理</span>
        </a>
        <a class="nav-link" href="./calendar.html">
          <span class="nav-icon">□</span>
          <span>カレンダー</span>
        </a>
        <a class="nav-link" href="./profile.html">
          <span class="nav-icon"><img class="nav-icon-image" src="./assets/profile-nav-icon.png" alt=""></span>
          <span>プロフィール</span>
        </a>
        <a class="nav-link" href="./settings.html">
          <span class="nav-icon">⚙</span>
          <span>設定</span>
        </a>
      </nav>
      <div class="sidebar-account">
        <img class="sidebar-avatar" src="./assets/iconfree.jpg" alt="プロフィール画像">
        <span id="topAccountName">user</span>
      </div>
      <a class="logout" href="./login.html">ログアウト</a>
    </aside>

    <main class="main">
      <div class="content">
        <a class="back-link" href="./projects.html">← 一覧に戻る</a>

        <section class="form-card">
          <h2 class="page-title">案件の追加</h2>

          <form id="projectForm">
            <div class="loading" id="loading">Loading...</div>
            <div class="form-grid">
              <div class="form-field full">
                <label for="title">案件名</label>
                <input id="title" name="title" type="text" required>
              </div>

              <div class="form-field">
                <label for="client">クライアント</label>
                <input id="client" name="client" type="text" required>
              </div>

              <div class="form-field">
                <label for="status">ステータス</label>
                <select id="status" name="status" required>
                  <option value="相談中">相談中</option>
                  <option value="進行中">進行中</option>
                  <option value="納品済み">納品済み</option>
                  <option value="入金待ち">入金待ち</option>
                  <option value="完了">完了</option>
                </select>
              </div>

              <div class="form-field">
                <label for="deadline">締切日</label>
                <input id="deadline" name="deadline" type="date">
              </div>

              <div class="form-field full">
                <label for="publicUrl">公開URL</label>
                <input id="publicUrl" name="publicUrl" type="url" inputmode="url" autocomplete="url" placeholder="https://example.com">
                <span class="items-help">納品・公開したWebサイトなど、外部から確認できるURLを登録できます。</span>
              </div>

              <div class="form-field full">
                <label for="memo">メモ</label>
                <textarea id="memo" name="memo"></textarea>
              </div>
            </div>

            <section class="tags-section">
              <div class="items-header">
                <h3 class="section-title">タグ</h3>
                <a class="ghost-button" href="./tags.html">新しいタグを追加</a>
              </div>
              <p class="items-help">内部管理用のタグです。請求書には表示されません。</p>
              <div class="tag-options" id="tagOptions">
                <p class="tag-empty">タグを読み込み中...</p>
              </div>
            </section>

            <section class="items-section">
              <div class="items-header">
                <h3 class="section-title">内訳</h3>
                <button class="ghost-button" id="addItemButton" type="button">内訳を追加</button>
              </div>
              <p class="items-help">複数の品目を登録できます。保存時に合計金額を自動で計算します。</p>
              <div class="items-list" id="itemsList"></div>
              <div class="total-box">
                <span class="total-label">合計金額</span>
                <span class="total-value" id="totalPriceText">¥0</span>
              </div>
            </section>

            <div class="actions">
              <a class="button secondary-button" href="./projects.html">キャンセル</a>
              <button class="button primary-button" id="saveButton" type="submit">保存する</button>
            </div>
          </form>
        </section>
      </div>
    </main>
  </div>

  <template id="itemRowTemplate">
    <div class="item-row">
      <div class="drag-handle" title="ドラッグして並び替え">⋮⋮</div>
      <div class="form-field">
        <label>品目名</label>
        <input class="item-name" type="text" placeholder="例：デザイン" required>
      </div>
      <div class="form-field">
        <label>区分</label>
        <select class="item-type">
          <option value="main">メイン</option>
          <option value="option">オプション</option>
        </select>
      </div>
      <div class="form-field">
        <label>金額</label>
        <input class="item-price" type="number" min="0" step="1" placeholder="50000" required>
      </div>
      <button class="danger-button remove-item-button" type="button">削除</button>
    </div>
  </template>

  <script type="module">
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { addDoc, collection, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { auth, db } from "./firebase.js";

    const projectForm = document.getElementById("projectForm");
    const itemsList = document.getElementById("itemsList");
    const itemRowTemplate = document.getElementById("itemRowTemplate");
    const addItemButton = document.getElementById("addItemButton");
    const totalPriceText = document.getElementById("totalPriceText");
    const saveButton = document.getElementById("saveButton");
    const loading = document.getElementById("loading");
    const tagOptions = document.getElementById("tagOptions");
    let currentUser = null;
    let draggedRow = null;

    function formatAmount(amount) {
      return "¥" + Number(amount || 0).toLocaleString("ja-JP");
    }

    function getTodayText() {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, "0");
      const day = String(today.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function addOneMonth(dateText) {
      if (!dateText) {
        return null;
      }

      const [year, month, day] = dateText.split("-").map(Number);
      if (!year || !month || !day) {
        return null;
      }

      const date = new Date(year, month - 1, day);
      date.setMonth(date.getMonth() + 1);

      const nextYear = date.getFullYear();
      const nextMonth = String(date.getMonth() + 1).padStart(2, "0");
      const nextDay = String(date.getDate()).padStart(2, "0");
      return `${nextYear}-${nextMonth}-${nextDay}`;
    }

    function getAutoPaidAt(status, deadline) {
      if (status === "完了") {
        return getTodayText();
      }

      return addOneMonth(deadline);
    }

    function createDisplayId(number) {
      return "PRJ-" + String(number).padStart(3, "0");
    }

    function parseDisplayId(displayId) {
      const match = /^PRJ-(\d+)$/.exec(String(displayId || ""));
      return match ? Number(match[1]) : 0;
    }

    async function generateNextDisplayId() {
      const snapshot = await getDocs(collection(db, "users", currentUser.uid, "projects"));
      let maxNumber = 0;

      snapshot.forEach((projectDoc) => {
        const currentNumber = parseDisplayId(projectDoc.data().displayId);

        if (currentNumber > maxNumber) {
          maxNumber = currentNumber;
        }
      });

      return createDisplayId(maxNumber + 1);
    }

    function collectSelectedTags() {
      return Array.from(tagOptions.querySelectorAll(".tag-checkbox:checked"))
        .map((checkbox) => checkbox.value);
    }

    async function loadTags() {
      const snapshot = await getDocs(collection(db, "users", currentUser.uid, "tags"));
      tagOptions.innerHTML = "";

      if (snapshot.empty) {
        tagOptions.innerHTML = '<p class="tag-empty">タグがありません。タグ管理から追加できます。</p>';
        return;
      }

      snapshot.docs
        .map((tagDoc) => tagDoc.data().name)
        .filter(Boolean)
        .sort((tagA, tagB) => tagA.localeCompare(tagB, "ja"))
        .forEach((tagName) => {
          const label = document.createElement("label");
          const checkbox = document.createElement("input");
          const text = document.createElement("span");

          label.className = "tag-option";
          checkbox.className = "tag-checkbox";
          checkbox.type = "checkbox";
          checkbox.value = tagName;
          text.textContent = tagName;

          label.appendChild(checkbox);
          label.appendChild(text);
          tagOptions.appendChild(label);
        });
    }

    function getDragAfterElement(container, mouseY) {
      const rows = [...container.querySelectorAll(".item-row:not(.dragging)")];

      return rows.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = mouseY - box.top - box.height * 0.35;

        if (offset < 0 && offset > closest.offset) {
          return { offset, element: child };
        }

        return closest;
      }, { offset: Number.NEGATIVE_INFINITY, element: null }).element;
    }

    // 内訳の入力欄を1行追加します。
    function addItemRow(name = "", price = "", type = "main") {
      const row = itemRowTemplate.content.firstElementChild.cloneNode(true);
      const nameInput = row.querySelector(".item-name");
      const typeInput = row.querySelector(".item-type");
      const priceInput = row.querySelector(".item-price");
      const removeButton = row.querySelector(".remove-item-button");

      row.draggable = true;
      nameInput.value = name;
      typeInput.value = type;
      priceInput.value = price;

      nameInput.addEventListener("input", updateTotalPrice);
      typeInput.addEventListener("change", updateTotalPrice);
      priceInput.addEventListener("input", updateTotalPrice);

      row.addEventListener("dragstart", (event) => {
        if (event.target.closest("input, select, button, textarea, label")) {
          event.preventDefault();
          return;
        }

        draggedRow = row;
        row.classList.add("dragging");
      });

      row.addEventListener("dragend", () => {
        row.classList.remove("dragging");
        draggedRow = null;
      });

      removeButton.addEventListener("click", () => {
        if (itemsList.children.length === 1) {
          nameInput.value = "";
          typeInput.value = "main";
          priceInput.value = "";
          updateTotalPrice();
          return;
        }

        row.remove();
        updateTotalPrice();
      });

      itemsList.appendChild(row);
      updateTotalPrice();
    }

    function collectItems() {
      return Array.from(itemsList.querySelectorAll(".item-row"))
        .map((row) => {
          return {
            name: row.querySelector(".item-name").value.trim(),
            type: row.querySelector(".item-type").value || "main",
            price: Number(row.querySelector(".item-price").value || 0)
          };
        })
        .filter((item) => item.name !== "" || item.price > 0);
    }

    function updateTotalPrice() {
      const totalPrice = collectItems().reduce((sum, item) => sum + item.price, 0);
      totalPriceText.textContent = formatAmount(totalPrice);
    }

    addItemButton.addEventListener("click", () => {
      addItemRow("", "", "option");
    });

    itemsList.addEventListener("dragover", (event) => {
      event.preventDefault();

      if (!draggedRow) {
        return;
      }

      const nextRow = getDragAfterElement(itemsList, event.clientY);

      if (!nextRow) {
        if (itemsList.lastElementChild !== draggedRow) {
          itemsList.appendChild(draggedRow);
        }
        return;
      }

      if (nextRow !== draggedRow) {
        itemsList.insertBefore(draggedRow, nextRow);
      }
    });

    // 最初に1行だけ表示して、すぐ入力できる状態にします。
    addItemRow();

    onAuthStateChanged(auth, async (user) => {
      if (window.FreelaBoardDemo?.isActive()) {
        window.FreelaBoardDemo.renderPageNotice(document.title.replace(" | FreelaBoard", ""));
        return;
      }
      if (!user) {
        window.location.href = "./login.html";
        return;
      }

      currentUser = user;
      try {
        await loadTags();
      } catch (error) {
        console.error("タグの取得に失敗しました:", error);
        tagOptions.innerHTML = '<p class="tag-empty">タグの取得に失敗しました</p>';
      } finally {
        loading.style.display = "none";
      }
    });

    // フォームが送信されたら items 配列と totalPrice を作って保存します。
    projectForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!currentUser) {
        alert("ログイン情報を確認できませんでした");
        return;
      }

      const formData = new FormData(projectForm);
      const items = collectItems();

      if (items.length === 0) {
        alert("内訳を1件以上入力してください");
        return;
      }

      if (items.some((item) => item.name === "" || item.price <= 0)) {
        alert("内訳の品目名と金額を正しく入力してください");
        return;
      }

      const totalPrice = items.reduce((sum, item) => sum + item.price, 0);

      saveButton.disabled = true;
      saveButton.textContent = "保存中...";
      loading.style.display = "block";

      try {
        const displayId = await generateNextDisplayId();
        const status = formData.get("status");
        const deadline = formData.get("deadline");

        await addDoc(collection(db, "users", currentUser.uid, "projects"), {
          displayId,
          title: formData.get("title"),
          client: formData.get("client"),
          status,
          deadline,
          paidAt: getAutoPaidAt(status, deadline),
          invoiceId: null,
          invoiceIssuedAt: null,
          paymentDueDate: null,
          tags: collectSelectedTags(),
          publicUrl: String(formData.get("publicUrl") || "").trim(),
          memo: formData.get("memo"),
          items,
          totalPrice,
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        });

        window.location.href = "./projects.html";
      } catch (error) {
        console.error("案件の保存に失敗しました:", error);
        alert("案件の保存に失敗しました");
        saveButton.disabled = false;
        saveButton.textContent = "保存する";
      } finally {
        loading.style.display = "none";
      }
    });
  </script>
  <script type="module" src="./assets/auth-common.js"></script>
  <script src="./assets/common.js?v=20260620-2"></script>
</body>
