<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プロフィール | FreelaBoard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      font-family: "Inter", "Noto Sans JP", Arial, sans-serif;
      background: #f4f6f8;
      color: #111827;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .app {
      min-height: 100vh;
      background: #f4f6f8;
    }

    .sidebar {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      width: 220px;
      padding: 24px 16px;
      background: #0f2a4a;
      color: #ffffff;
    }

    .logo {
      margin: 0 0 28px;
      font-size: 20px;
      font-weight: 700;
    }

    .nav {
      display: grid;
      gap: 8px;
    }

    .nav-link,
    .logout-button {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 12px 14px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #dbeafe;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
    }

    .nav-link:hover,
    .nav-link.active {
      background: #163b68;
      color: #ffffff;
    }

    .nav-icon {
      display: grid;
      place-items: center;
      width: 20px;
      height: 20px;
      font-size: 15px;
    }

    .nav-icon-image {
      width: 16px;
      height: 16px;
      object-fit: contain;
    }

    .logout-button {
      color: #dbeafe;
    }

    .logout-button:hover {
      background: #163b68;
      color: #ffffff;
    }

    .sidebar-account {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: auto;
      margin-bottom: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
    }

    .sidebar-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .main {
      margin-left: 220px;
      padding: 40px;
    }

    .content {
      max-width: 760px;
      margin: 0 auto;
    }

    .page-header {
      margin-bottom: 24px;
    }

    .page-title {
      margin: 0;
      font-size: 30px;
      letter-spacing: 0;
    }

    .page-lead {
      margin: 8px 0 0;
      color: #6b7280;
      font-size: 14px;
    }

    .card {
      padding: 26px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 12px 30px rgba(17, 24, 39, 0.06);
    }

    .card + .card {
      margin-top: 20px;
    }

    .card-title {
      margin: 0 0 24px;
      font-size: 18px;
      letter-spacing: 0;
    }

    .profile-grid {
      display: grid;
      grid-template-columns: 170px 1fr;
      gap: 32px;
      align-items: start;
    }

    .avatar-area {
      display: grid;
      justify-items: center;
      gap: 14px;
    }

    .avatar {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      object-fit: cover;
    }

    .profile-form {
      display: grid;
      gap: 18px;
    }

    .info-row {
      display: grid;
      grid-template-columns: 140px 1fr auto;
      gap: 12px;
      align-items: center;
    }

    .info-label {
      color: #374151;
      font-size: 14px;
      font-weight: 700;
    }

    .info-value {
      min-width: 0;
      color: #111827;
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    input {
      width: 100%;
      min-height: 42px;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      color: #111827;
      font: inherit;
      font-size: 14px;
    }

    input:focus {
      border-color: #4f46e5;
      outline: none;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.14);
    }

    .icon-button {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #4f46e5;
      font-size: 16px;
      cursor: pointer;
    }

    .icon-button:hover {
      background: #eef2ff;
    }

    .save-row {
      display: none;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 2px;
    }

    .save-row.show {
      display: flex;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 16px;
      border: none;
      border-radius: 8px;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary-button {
      background: #6257e8;
      color: #ffffff;
    }

    .secondary-button {
      background: #f3f4f6;
      color: #374151;
    }

    .button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .message {
      display: none;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #fee2e2;
      color: #b91c1c;
    }

    .message.success {
      background: #dcfce7;
      color: #166534;
    }

    .accordion-card {
      padding: 0;
      overflow: hidden;
    }

    .accordion-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 18px 22px;
      border: none;
      background: #ffffff;
      color: #111827;
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .accordion-button:hover {
      background: #f9fafb;
    }

    .accordion-icon {
      color: #6b7280;
      font-size: 16px;
    }

    .accordion-body {
      display: none;
      padding: 0 22px 22px;
      border-top: 1px solid #e5e7eb;
    }

    .accordion-card.open .accordion-body {
      display: block;
    }

    .accordion-card.open .accordion-icon {
      transform: rotate(180deg);
    }

    .password-form {
      display: grid;
      gap: 12px;
      padding-top: 18px;
    }

    .password-grid {
      display: grid;
      gap: 10px;
    }

    .field-label {
      color: #374151;
      font-size: 13px;
      font-weight: 700;
    }

    .notice-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .notice-title {
      margin: 0 0 6px;
      font-size: 15px;
      font-weight: 700;
    }

    .notice-text {
      margin: 0;
      color: #6b7280;
      font-size: 13px;
    }

    .toggle {
      position: relative;
      width: 46px;
      height: 26px;
      border: none;
      border-radius: 999px;
      background: #6257e8;
      cursor: pointer;
    }

    .toggle::after {
      position: absolute;
      top: 3px;
      right: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #ffffff;
      content: "";
    }

    .footer {
      margin-top: 28px;
      color: #9ca3af;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 820px) {
      .sidebar {
        position: static;
        width: 100%;
        height: auto;
        padding: 14px 16px;
      }

      .nav {
        grid-template-columns: repeat(10, minmax(0, 1fr));
      }

      .nav-link {
        justify-content: center;
        padding: 10px;
      }

      .nav-icon,
      .logout-button {
        display: none;
      }

      .main {
        margin-left: 0;
        padding: 24px 16px;
      }

      .profile-grid,
      .info-row {
        grid-template-columns: 1fr;
      }

      .icon-button {
        width: 100%;
        background: #eef2ff;
      }

      .save-row {
        flex-direction: column;
      }
    }

  </style>
  <link rel="stylesheet" href="./assets/shared-layout.css?v=20260620-2">
  <link rel="stylesheet" href="./assets/common.css?v=20260620-2">
  <script src="./assets/demo-mode.js?v=20260620-2"></script>
</head>
<body>
  <header class="mobile-header">
    <button class="hamburger-button" type="button" aria-label="メニューを開く" aria-controls="appSidebar" aria-expanded="false"><span></span><span></span><span></span></button>
    <span class="mobile-logo">FreelaBoard</span>
  </header>
  <div class="sidebar-overlay" data-sidebar-overlay></div>
  <div class="app">
    <aside class="sidebar" id="appSidebar">
      
      <button class="sidebar-close" type="button" aria-label="メニューを閉じる">×</button>
      <h1 class="logo">FreelaBoard</h1>

      <nav class="nav" aria-label="メインメニュー">
        <a class="nav-link" href="./dashboard.html">
          <span class="nav-icon">⌂</span>
          <span>ダッシュボード</span>
        </a>
        <a class="nav-link" href="./projects.html">
          <span class="nav-icon">☷</span>
          <span>案件一覧</span>
        </a>
        <a class="nav-link" href="./add-project.html">
          <span class="nav-icon">＋</span>
          <span>案件追加</span>
        </a>
        <a class="nav-link" href="./invoices.html">
          <span class="nav-icon">▤</span>
          <span>請求書一覧</span>
        </a>
        <a class="nav-link" href="./reports.html">
          <span class="nav-icon">↗</span>
          <span>レポート</span>
        </a>
        <a class="nav-link" href="./clients.html">
          <span class="nav-icon">◇</span>
          <span>クライアント管理</span>
        </a>
        <a class="nav-link" href="./tags.html">
          <span class="nav-icon">#</span>
          <span>タグ管理</span>
        </a>
        <a class="nav-link" href="./calendar.html">
          <span class="nav-icon">□</span>
          <span>カレンダー</span>
        </a>
        <a class="nav-link active" href="./profile.html" aria-current="page">
          <span class="nav-icon"><img class="nav-icon-image" src="./assets/profile-nav-icon.png" alt=""></span>
          <span>プロフィール</span>
        </a>
        <a class="nav-link" href="./settings.html">
          <span class="nav-icon">⚙</span>
          <span>設定</span>
        </a>
      </nav>
      <div class="sidebar-account">
        <img class="sidebar-avatar" src="./assets/iconfree.jpg" alt="プロフィール画像">
        <span id="topUserId">user</span>
      </div>
      <button class="logout-button" id="logoutButton" type="button">
        <span class="nav-icon">↩</span>
        <span>ログアウト</span>
      </button>
    </aside>

    <main class="main">
      <div class="content">
        <header class="page-header">
          <h1 class="page-title">プロフィール</h1>
          <p class="page-lead">アカウント情報の確認・編集ができます。</p>
        </header>

        <section class="card">
          <h2 class="card-title">プロフィール情報</h2>

          <div class="profile-grid">
            <div class="avatar-area">
              <img class="avatar" src="./assets/iconfree.jpg" alt="プロフィール画像">
            </div>

            <form class="profile-form" id="profileForm">
              <div class="info-row" id="userIdViewRow">
                <div class="info-label">ユーザーID</div>
                <div class="info-value" id="userIdText">-</div>
                <button class="icon-button" id="editUserIdButton" type="button" aria-label="ユーザーIDを編集">✎</button>
              </div>

              <div class="info-row" id="userIdEditRow" hidden>
                <label class="info-label" for="userId">ユーザーID</label>
                <input id="userId" name="userId" type="text" minlength="3" maxlength="20" pattern="[A-Za-z0-9_]{3,20}" required>
                <span></span>
              </div>

              <div class="info-row">
                <div class="info-label">メールアドレス</div>
                <div class="info-value" id="emailText">-</div>
                <span class="icon-button" aria-hidden="true">✎</span>
              </div>

              <div class="info-row">
                <div class="info-label">登録日</div>
                <div class="info-value" id="createdAtText">-</div>
                <span class="icon-button" aria-hidden="true">▣</span>
              </div>

              <p class="message" id="message"></p>

              <div class="save-row" id="saveRow">
                <button class="button secondary-button" id="cancelEditButton" type="button">キャンセル</button>
                <button class="button primary-button" id="saveButton" type="submit">保存する</button>
              </div>
            </form>
          </div>
        </section>

        <section class="card accordion-card" id="passwordAccordion">
          <button class="accordion-button" id="passwordAccordionButton" type="button" aria-expanded="false">
            <span>パスワード変更</span>
            <span class="accordion-icon">⌄</span>
          </button>
          <div class="accordion-body">
            <form class="password-form">
              <div class="password-grid">
                <label class="field-label" for="currentPassword">現在のパスワード</label>
                <input id="currentPassword" type="password" placeholder="現在のパスワードを入力" disabled>
              </div>
              <div class="password-grid">
                <label class="field-label" for="newPassword">新しいパスワード</label>
                <input id="newPassword" type="password" placeholder="新しいパスワードを入力" disabled>
              </div>
              <div class="password-grid">
                <label class="field-label" for="confirmPassword">新しいパスワード（確認用）</label>
                <input id="confirmPassword" type="password" placeholder="新しいパスワードを再入力" disabled>
              </div>
              <button class="button primary-button" type="button" disabled>パスワードを変更</button>
            </form>
          </div>
        </section>

        <section class="card notice-card">
          <div>
            <p class="notice-title">通知設定</p>
            <p class="notice-text">案件の締切リマインドを受け取る</p>
          </div>
          <button class="toggle" type="button" aria-label="通知設定"></button>
        </section>

        <p class="footer">© 2024 FreelaBoard</p>
      </div>
    </main>
  </div>

  <script type="module">
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { doc, getDoc, serverTimestamp, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { auth, db } from "./firebase.js";

    const topUserId = document.getElementById("topUserId");
    const profileForm = document.getElementById("profileForm");
    const userIdViewRow = document.getElementById("userIdViewRow");
    const userIdEditRow = document.getElementById("userIdEditRow");
    const userIdText = document.getElementById("userIdText");
    const userIdInput = document.getElementById("userId");
    const emailText = document.getElementById("emailText");
    const createdAtText = document.getElementById("createdAtText");
    const editUserIdButton = document.getElementById("editUserIdButton");
    const cancelEditButton = document.getElementById("cancelEditButton");
    const saveRow = document.getElementById("saveRow");
    const message = document.getElementById("message");
    const saveButton = document.getElementById("saveButton");
    const logoutButton = document.getElementById("logoutButton");
    const passwordAccordion = document.getElementById("passwordAccordion");
    const passwordAccordionButton = document.getElementById("passwordAccordionButton");
    let currentUser = null;
    let currentUserId = "";

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message show " + type;
    }

    function hideMessage() {
      message.textContent = "";
      message.className = "message";
    }

    function isValidUserId(userId) {
      return /^[A-Za-z0-9_]{3,20}$/.test(userId);
    }

    function formatDate(value) {
      if (!value) {
        return "-";
      }

      const date = typeof value.toDate === "function" ? value.toDate() : new Date(value);

      if (Number.isNaN(date.getTime())) {
        return "-";
      }

      return date.toLocaleDateString("ja-JP");
    }

    function setUserId(userId) {
      currentUserId = userId || "";
      userIdText.textContent = currentUserId || "-";
      topUserId.textContent = currentUserId || "user";
      userIdInput.value = currentUserId;
    }

    function showEditMode() {
      hideMessage();
      userIdViewRow.hidden = true;
      userIdEditRow.hidden = false;
      saveRow.classList.add("show");
      userIdInput.focus();
    }

    function hideEditMode() {
      userIdViewRow.hidden = false;
      userIdEditRow.hidden = true;
      saveRow.classList.remove("show");
      userIdInput.value = currentUserId;
    }

    async function loadProfile(user) {
      currentUser = user;
      emailText.textContent = user.email || "-";

      try {
        const profileRef = doc(db, "users", user.uid);
        const profileSnapshot = await getDoc(profileRef);

        if (profileSnapshot.exists()) {
          const profile = profileSnapshot.data();
          setUserId(profile.userId || "");
          createdAtText.textContent = formatDate(profile.createdAt);
        } else {
          setUserId("");
          createdAtText.textContent = "-";
          showMessage("プロフィール情報がまだありません。ユーザーIDを編集して保存してください。", "error");
        }
      } catch (error) {
        console.error("プロフィールの取得に失敗しました:", error);
        showMessage("プロフィールの取得に失敗しました。", "error");
      }
    }

    onAuthStateChanged(auth, (user) => {
      if (window.FreelaBoardDemo?.isActive()) {
        const profile = window.FreelaBoardDemo.getProfile();
        currentUser = { uid: "demo", email: profile.email };
        emailText.textContent = profile.email;
        setUserId(profile.userId);
        createdAtText.textContent = formatDate(profile.createdAt);
        showMessage("デモ版のプロフィールです。保存は実行されません。", "success");
        return;
      }
      if (!user) {
        window.location.href = "./login.html";
        return;
      }

      loadProfile(user);
    });

    editUserIdButton.addEventListener("click", showEditMode);

    cancelEditButton.addEventListener("click", () => {
      hideMessage();
      hideEditMode();
    });

    profileForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      hideMessage();

      if (window.FreelaBoardDemo?.isActive()) {
        showMessage("デモ版ではプロフィール保存は実行されません。", "success");
        hideEditMode();
        return;
      }

      if (!currentUser) {
        window.location.href = "./login.html";
        return;
      }

      const userId = userIdInput.value.trim();

      if (!isValidUserId(userId)) {
        showMessage("ユーザーIDは半角英数字とアンダースコアのみ、3文字以上20文字以内で入力してください。", "error");
        return;
      }

      saveButton.disabled = true;
      saveButton.textContent = "保存中...";

      try {
        await setDoc(doc(db, "users", currentUser.uid), {
          userId,
          email: currentUser.email || "",
          updatedAt: serverTimestamp()
        }, { merge: true });

        setUserId(userId);
        hideEditMode();
        showMessage("プロフィールを保存しました。", "success");
      } catch (error) {
        console.error("プロフィールの保存に失敗しました:", error);
        showMessage("プロフィールの保存に失敗しました。", "error");
      } finally {
        saveButton.disabled = false;
        saveButton.textContent = "保存する";
      }
    });

    logoutButton.addEventListener("click", async () => {
      if (window.FreelaBoardDemo?.isActive()) {
        window.FreelaBoardDemo.exit();
        window.location.href = "./login.html?demo=0";
        return;
      }

      try {
        await signOut(auth);
        window.location.href = "./login.html";
      } catch (error) {
        console.error("ログアウトに失敗しました:", error);
        showMessage("ログアウトに失敗しました。", "error");
      }
    });

    passwordAccordionButton.addEventListener("click", () => {
      const isOpen = passwordAccordion.classList.toggle("open");
      passwordAccordionButton.setAttribute("aria-expanded", String(isOpen));
    });
  </script>
  <script src="./assets/common.js?v=20260620-2"></script>
</body>
</html>
