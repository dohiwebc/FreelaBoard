<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン | FreelaBoard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", "Noto Sans JP", Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    a {
      color: #4f46e5;
      font-weight: 700;
      text-decoration: none;
    }

    .auth-page {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 32px 20px;
    }

    .auth-card {
      width: min(520px, 100%);
      padding: 56px 42px;
      border: 1px solid #dbe1ea;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 16px 40px rgba(17, 24, 39, 0.08);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
      color: #0f1f45;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .brand-icon {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border: 3px solid #0f1f45;
      border-radius: 6px;
      font-size: 20px;
      line-height: 1;
    }

    .lead {
      margin: 0 0 40px;
      color: #4b5563;
      font-size: 17px;
      text-align: center;
    }

    .form {
      display: grid;
      gap: 24px;
    }

    .form-field {
      display: grid;
      gap: 9px;
    }

    label {
      color: #111827;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 46px;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      color: #111827;
      font: inherit;
      font-size: 15px;
    }

    input:focus {
      border-color: #4f46e5;
      outline: none;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.14);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 54px;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 10px;
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #4b5563;
      font-size: 18px;
      cursor: pointer;
      transform: translateY(-50%);
    }

    .toggle-password:hover {
      background: #f3f4f6;
    }

    .error-message {
      display: none;
      padding: 12px 14px;
      border-radius: 8px;
      background: #fee2e2;
      color: #b91c1c;
      font-size: 14px;
      line-height: 1.6;
    }

    .error-message.show {
      display: block;
    }

    .error-message.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .submit-button {
      min-height: 48px;
      border: none;
      border-radius: 8px;
      background: #6257e8;
      color: #ffffff;
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(98, 87, 232, 0.24);
    }

    .submit-button:hover {
      background: #5548dd;
    }

    .submit-button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    .reset-password-button {
      justify-self: end;
      margin-top: -12px;
      padding: 2px 0;
      border: 0;
      background: transparent;
      color: #4f46e5;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .reset-password-button:hover {
      text-decoration: underline;
    }

    .reset-password-button:disabled {
      cursor: wait;
      opacity: 0.6;
    }

    .divider {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 18px;
      align-items: center;
      margin: 32px 0;
      color: #6b7280;
      font-size: 14px;
    }

    .divider::before,
    .divider::after {
      height: 1px;
      background: #e5e7eb;
      content: "";
    }

    .footer-text {
      margin: 0;
      color: #6b7280;
      font-size: 14px;
      text-align: center;
    }

    @media (max-width: 560px) {
      .auth-card {
        padding: 36px 22px;
      }

      .brand {
        font-size: 26px;
      }
    }

  </style>
  <link rel="stylesheet" href="./assets/shared-layout.css?v=20260620-2">
  <link rel="stylesheet" href="./assets/common.css?v=20260620-2">
  <script src="./assets/demo-mode.js?v=20260620-2"></script>
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <div class="brand">
        <span class="brand-icon">▣</span>
        <span>FreelaBoard</span>
      </div>
      <p class="lead">アカウントにログイン</p>

      <form class="form" id="loginForm">
        <div class="form-field">
          <label for="email">メールアドレス</label>
          <input id="email" name="email" type="email" placeholder="例：example@email.com" autocomplete="email" required>
        </div>

        <div class="form-field">
          <label for="password">パスワード</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" placeholder="パスワードを入力" autocomplete="current-password" required>
            <button class="toggle-password" id="togglePassword" type="button" aria-label="パスワードを表示">◉</button>
          </div>
        </div>

        <button class="reset-password-button" id="resetPasswordButton" type="button">パスワードを忘れた方</button>

        <p class="error-message" id="errorMessage" role="alert" aria-live="polite"></p>

        <button class="submit-button" id="submitButton" type="submit">ログイン</button>
      </form>

      <div class="divider">または</div>

      <p class="footer-text" style="margin-bottom: 14px;">
        <a href="./dashboard.html?demo=1">サンプルダッシュボードを見る</a>
      </p>

      <p class="footer-text">
        アカウントをお持ちでないですか？
        <a href="./register.html">新規登録はこちら</a>
      </p>
    </section>
  </main>

  <script>
    if (window.location.protocol === "file:") {
      const errorMessage = document.getElementById("errorMessage");
      const submitButton = document.getElementById("submitButton");

      errorMessage.textContent = "この画面はファイルから直接開くとログインできません。http://localhost などのWebサーバー経由で開いてください。";
      errorMessage.classList.add("show");
      submitButton.disabled = true;
    }
  </script>

  <script type="module">
    import {
      browserLocalPersistence,
      sendPasswordResetEmail,
      setPersistence,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { auth } from "./firebase.js";

    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");
    const errorMessage = document.getElementById("errorMessage");
    const submitButton = document.getElementById("submitButton");
    const resetPasswordButton = document.getElementById("resetPasswordButton");

    function showMessage(message, tone = "error") {
      errorMessage.textContent = message;
      errorMessage.classList.add("show");
      errorMessage.classList.toggle("success", tone === "success");
    }

    function hideMessage() {
      errorMessage.textContent = "";
      errorMessage.classList.remove("show", "success");
    }

    function getJapaneseErrorMessage(errorCode) {
      if (errorCode === "auth/invalid-email") {
        return "メールアドレスの形式が正しくありません。";
      }

      if (
        errorCode === "auth/user-not-found" ||
        errorCode === "auth/wrong-password" ||
        errorCode === "auth/invalid-credential"
      ) {
        return "メールアドレスまたはパスワードが正しくありません。";
      }

      if (errorCode === "auth/too-many-requests") {
        return "ログイン試行回数が多すぎます。しばらく時間をおいてから再度お試しください。";
      }

      if (errorCode === "auth/network-request-failed") {
        return "ネットワークエラーが発生しました。通信環境を確認してください。";
      }

      if (errorCode === "auth/user-disabled") {
        return "このアカウントは現在利用できません。管理者にお問い合わせください。";
      }

      if (errorCode === "auth/operation-not-allowed") {
        return "メールアドレスでのログインが無効になっています。管理者にお問い合わせください。";
      }

      if (errorCode === "auth/unauthorized-domain") {
        return "現在のURLからはログインできません。正しいサイトURLから開き直してください。";
      }

      return `ログインに失敗しました。しばらくしてから再度お試しください。（${errorCode || "unknown"}）`;
    }

    togglePassword.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";

      passwordInput.type = isPassword ? "text" : "password";
      togglePassword.textContent = isPassword ? "○" : "◉";
      togglePassword.setAttribute("aria-label", isPassword ? "パスワードを非表示" : "パスワードを表示");
    });

    // フォーム送信時にFirebase Authenticationでログインします。
    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      hideMessage();

      submitButton.disabled = true;
      submitButton.textContent = "ログイン中...";

      try {
        await setPersistence(auth, browserLocalPersistence);
        await signInWithEmailAndPassword(
          auth,
          emailInput.value.trim(),
          passwordInput.value
        );

        sessionStorage.removeItem("freelaboardDemoMode");
        window.location.replace("./dashboard.html?demo=0");
      } catch (error) {
        console.error("ログインに失敗しました:", error.code, error.message);
        showMessage(getJapaneseErrorMessage(error.code));
        submitButton.disabled = false;
        submitButton.textContent = "ログイン";
      }
    });

    resetPasswordButton.addEventListener("click", async () => {
      hideMessage();
      const email = emailInput.value.trim();

      if (!email) {
        showMessage("パスワードを再設定するメールアドレスを入力してください。");
        emailInput.focus();
        return;
      }

      if (!emailInput.validity.valid) {
        showMessage("メールアドレスの形式が正しくありません。");
        emailInput.focus();
        return;
      }

      resetPasswordButton.disabled = true;
      resetPasswordButton.textContent = "送信中...";

      try {
        auth.useDeviceLanguage();
        await sendPasswordResetEmail(auth, email);
        showMessage(
          "パスワード再設定メールを送信しました。受信箱と迷惑メールフォルダをご確認ください。",
          "success"
        );
      } catch (error) {
        console.error("パスワード再設定メールの送信に失敗しました:", error.code, error.message);

        if (error.code === "auth/too-many-requests") {
          showMessage("送信回数が多すぎます。しばらく時間をおいてから再度お試しください。");
        } else if (error.code === "auth/network-request-failed") {
          showMessage("ネットワークエラーが発生しました。通信環境を確認してください。");
        } else {
          showMessage("再設定メールを送信できませんでした。メールアドレスを確認してください。");
        }
      } finally {
        resetPasswordButton.disabled = false;
        resetPasswordButton.textContent = "パスワードを忘れた方";
      }
    });
  </script>
  <script src="./assets/common.js?v=20260620-2"></script>
</body>
</html>
