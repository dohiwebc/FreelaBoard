<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>請求書一覧 | FreelaBoard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Inter", "Noto Sans JP", Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      width: 220px;
      height: 100vh;
      padding: 24px 16px;
      background: #0f2a4a;
      color: #ffffff;
    }

    .logo {
      margin: 0 0 28px;
      font-size: 20px;
      font-weight: 700;
    }

    .nav {
      display: grid;
      gap: 8px;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 8px;
      color: #dbeafe;
      font-size: 14px;
      font-weight: 700;
    }

    .nav-link:hover,
    .nav-link.active {
      background: #163b68;
      color: #ffffff;
    }

    .nav-icon {
      display: grid;
      place-items: center;
      width: 20px;
      height: 20px;
      font-size: 15px;
    }

    .nav-icon-image {
      width: 16px;
      height: 16px;
      object-fit: contain;
    }

    .logout {
      color: #dbeafe;
      font-size: 14px;
      font-weight: 700;
    }

    .sidebar-account {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: auto;
      margin-bottom: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
    }

    .sidebar-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .main {
      width: 100%;
      margin-left: 220px;
      padding: 40px;
    }

    .content {
      max-width: 1100px;
      margin: 0 auto;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .page-title {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .table-card {
      overflow: hidden;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 12px 30px rgba(17, 24, 39, 0.08);
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 980px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 16px 18px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      font-size: 14px;
      vertical-align: middle;
    }

    th {
      background: #f9fafb;
      color: #374151;
      font-size: 13px;
      font-weight: 700;
    }

    tbody tr:hover {
      background: #f9fafb;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .invoice-number,
    .project-name,
    .amount {
      font-weight: 700;
    }

    .preview-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 0 12px;
      border-radius: 8px;
      background: #dbeafe;
      color: #2563eb;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .preview-button:hover {
      background: #bfdbfe;
    }

    .loading,
    .empty,
    .message {
      padding: 40px 20px;
      color: #6b7280;
      text-align: center;
      font-size: 14px;
    }

    .empty {
      display: none;
    }

    @media (max-width: 820px) {
      .layout {
        display: block;
      }

      .sidebar {
        position: static;
        width: 100%;
        height: auto;
        padding: 18px 16px;
      }

      .logo {
        margin-bottom: 16px;
      }

      .nav {
        grid-template-columns: repeat(10, minmax(0, 1fr));
      }

      .nav-link {
        justify-content: center;
        padding: 10px;
      }

      .nav-icon,
      .logout {
        display: none;
      }

      .main {
        margin-left: 0;
        padding: 24px 16px;
      }

      .page-header {
        align-items: stretch;
        flex-direction: column;
      }
    }

  </style>
  <link rel="stylesheet" href="./assets/shared-layout.css?v=20260620-2">
  <link rel="stylesheet" href="./assets/common.css?v=20260620-2">
  <script src="./assets/demo-mode.js?v=20260620-2"></script>
</head>
<body>
  <header class="mobile-header">
    <button class="hamburger-button" type="button" aria-label="メニューを開く" aria-controls="appSidebar" aria-expanded="false"><span></span><span></span><span></span></button>
    <span class="mobile-logo">FreelaBoard</span>
  </header>
  <div class="sidebar-overlay" data-sidebar-overlay></div>
  <div class="layout">
    <aside class="sidebar" id="appSidebar">
      
      <button class="sidebar-close" type="button" aria-label="メニューを閉じる">×</button>
      <h1 class="logo">FreelaBoard</h1>

      <nav class="nav" aria-label="メインメニュー">
        <a class="nav-link" href="./dashboard.html">
          <span class="nav-icon">⌂</span>
          <span>ダッシュボード</span>
        </a>
        <a class="nav-link" href="./projects.html">
          <span class="nav-icon">☷</span>
          <span>案件一覧</span>
        </a>
        <a class="nav-link" href="./add-project.html">
          <span class="nav-icon">＋</span>
          <span>案件追加</span>
        </a>
        <a class="nav-link active" href="./invoices.html" aria-current="page">
          <span class="nav-icon">▤</span>
          <span>請求書一覧</span>
        </a>
        <a class="nav-link" href="./reports.html">
          <span class="nav-icon">↗</span>
          <span>レポート</span>
        </a>
        <a class="nav-link" href="./clients.html">
          <span class="nav-icon">◇</span>
          <span>クライアント管理</span>
        </a>
        <a class="nav-link" href="./tags.html">
          <span class="nav-icon">#</span>
          <span>タグ管理</span>
        </a>
        <a class="nav-link" href="./calendar.html">
          <span class="nav-icon">□</span>
          <span>カレンダー</span>
        </a>
        <a class="nav-link" href="./profile.html">
          <span class="nav-icon"><img class="nav-icon-image" src="./assets/profile-nav-icon.png" alt=""></span>
          <span>プロフィール</span>
        </a>
        <a class="nav-link" href="./settings.html">
          <span class="nav-icon">⚙</span>
          <span>設定</span>
        </a>
      </nav>
      <div class="sidebar-account">
        <img class="sidebar-avatar" src="./assets/iconfree.jpg" alt="プロフィール画像">
        <span id="topAccountName">user</span>
      </div>
      <a class="logout" href="./login.html">ログアウト</a>
    </aside>

    <main class="main">
      <div class="content">
        <header class="page-header">
          <h2 class="page-title">請求書一覧</h2>
        </header>

        <section class="table-card" aria-label="請求書一覧テーブル">
          <div class="loading" id="loading">Loading...</div>
          <p class="empty" id="emptyMessage">発行済みの請求書はありません</p>

          <div class="table-wrap" id="tableWrap">
            <table>
              <thead>
                <tr>
                  <th>請求書番号</th>
                  <th>案件ID</th>
                  <th>案件名</th>
                  <th>クライアント</th>
                  <th>金額</th>
                  <th>発行日</th>
                  <th>支払期限</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="invoiceTableBody">
                <tr>
                  <td class="message" colspan="8">読み込み中...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script type="module">
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { collection, doc, getDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { auth, db } from "./firebase.js";

    const loading = document.getElementById("loading");
    const tableWrap = document.getElementById("tableWrap");
    const emptyMessage = document.getElementById("emptyMessage");
    const invoiceTableBody = document.getElementById("invoiceTableBody");
    const topAccountName = document.getElementById("topAccountName");
    let currentUser = null;

    function pickValue(project, keys, defaultValue = "-") {
      for (const key of keys) {
        if (project[key] !== undefined && project[key] !== null && project[key] !== "") {
          return project[key];
        }
      }

      return defaultValue;
    }

    function formatAmount(amount) {
      return "¥" + Number(amount || 0).toLocaleString("ja-JP");
    }

    function formatDate(value) {
      if (!value) {
        return "-";
      }

      const date = typeof value.toDate === "function" ? value.toDate() : new Date(value);

      if (Number.isNaN(date.getTime())) {
        return String(value).replaceAll("-", "/");
      }

      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}/${month}/${day}`;
    }

    function toTime(value) {
      if (!value) {
        return 0;
      }

      const date = typeof value.toDate === "function" ? value.toDate() : new Date(value);
      return Number.isNaN(date.getTime()) ? 0 : date.getTime();
    }

    function getProjectTotal(project) {
      if (project.totalPrice !== undefined && project.totalPrice !== null) {
        return Number(project.totalPrice || 0);
      }

      return Number(pickValue(project, ["price", "amount", "fee"], 0));
    }

    function createInvoiceRow(project) {
      const row = document.createElement("tr");
      const previewCell = document.createElement("td");
      const previewLink = document.createElement("a");
      const cells = [
        { text: pickValue(project, ["invoiceId"], "未設定"), className: "invoice-number" },
        { text: pickValue(project, ["displayId"], "未設定") },
        { text: pickValue(project, ["title", "name", "projectName"], "-"), className: "project-name" },
        { text: pickValue(project, ["client", "clientName"], "-") },
        { text: formatAmount(getProjectTotal(project)), className: "amount" },
        { text: formatDate(project.invoiceIssuedAt) },
        { text: formatDate(project.paymentDueDate) }
      ];

      cells.forEach((cellData) => {
        const cell = document.createElement("td");
        cell.textContent = cellData.text;
        if (cellData.className) {
          cell.className = cellData.className;
        }
        row.appendChild(cell);
      });

      previewLink.className = "preview-button";
      previewLink.href = "./invoice.html?id=" + encodeURIComponent(project.id);
      previewLink.textContent = "プレビュー";
      previewCell.appendChild(previewLink);
      row.appendChild(previewCell);

      return row;
    }

    async function loadAccountName() {
      try {
        const userSnapshot = await getDoc(doc(db, "users", currentUser.uid));
        topAccountName.textContent = userSnapshot.exists()
          ? userSnapshot.data().userId || currentUser.email
          : currentUser.email;
      } catch (error) {
        topAccountName.textContent = currentUser.email || "user";
      }
    }

    async function loadInvoices() {
      loading.style.display = "block";
      tableWrap.style.display = "none";
      emptyMessage.style.display = "none";

      try {
        const querySnapshot = await getDocs(collection(db, "users", currentUser.uid, "projects"));
        const issuedProjects = querySnapshot.docs
          .map((projectDoc) => {
            return {
              ...projectDoc.data(),
              id: projectDoc.id
            };
          })
          .filter((project) => project.invoiceIssuedAt)
          .sort((projectA, projectB) => toTime(projectB.invoiceIssuedAt) - toTime(projectA.invoiceIssuedAt));

        if (issuedProjects.length === 0) {
          emptyMessage.style.display = "block";
          return;
        }

        invoiceTableBody.innerHTML = "";
        issuedProjects.forEach((project) => {
          invoiceTableBody.appendChild(createInvoiceRow(project));
        });
        tableWrap.style.display = "block";
      } catch (error) {
        console.error("請求書一覧の取得に失敗しました:", error);
        invoiceTableBody.innerHTML = '<tr><td class="message" colspan="8">請求書一覧の取得に失敗しました</td></tr>';
        tableWrap.style.display = "block";
      } finally {
        loading.style.display = "none";
      }
    }

    onAuthStateChanged(auth, async (user) => {
      if (window.FreelaBoardDemo?.isActive()) {
        topAccountName.textContent = "demo";
        loading.style.display = "none";
        emptyMessage.style.display = "none";
        const issuedProjects = window.FreelaBoardDemo.getProjects()
          .filter((project) => project.invoiceIssuedAt)
          .sort((projectA, projectB) => toTime(projectB.invoiceIssuedAt) - toTime(projectA.invoiceIssuedAt));
        invoiceTableBody.replaceChildren();
        issuedProjects.forEach((project) => invoiceTableBody.appendChild(createInvoiceRow(project)));
        tableWrap.style.display = issuedProjects.length ? "block" : "none";
        emptyMessage.style.display = issuedProjects.length ? "none" : "block";
        return;
      }
      if (!user) {
        window.location.href = "./login.html";
        return;
      }

      currentUser = user;
      await loadAccountName();
      await loadInvoices();
    });
  </script>
  <script src="./assets/common.js?v=20260620-2"></script>
</body>
</html>
